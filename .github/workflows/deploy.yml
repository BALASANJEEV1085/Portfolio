name: Build, Deploy and Verify Portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGION: ap-south-1
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: portfolio
  IMAGE_TAG: ${{ github.sha }}
  INSTANCE_ID: i-0e196034192c0264a
  PORT: 3000
  PUBLIC_URL: http://3.7.91.80

jobs:
  build-and-deploy:
    name: Build, Push, Deploy & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Build diagnostics
        run: |
          echo "=== Next.js build output ==="
          ls -la .next/ 2>/dev/null && echo ".next/ exists" || echo ".next/ not found"
          ls -la dist/ 2>/dev/null && echo "dist/ exists" || true
          echo "=== Project files ==="
          ls -la

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        run: |
          mkdir -p ~/.aws
          cat > ~/.aws/credentials << 'EOF'
          [default]
          aws_access_key_id = ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key = ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          region = ${{ env.REGION }}
          EOF

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region ${{ env.REGION }} | docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}

      - name: Build and push Docker image
        run: |
          FULL_IMAGE="${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}"
          docker build -t "$FULL_IMAGE" .
          docker push "$FULL_IMAGE"
          echo "IMAGE_URI=$FULL_IMAGE" >> $GITHUB_ENV

      - name: Deploy to EC2 via SSM
        run: |
          REGION="${{ env.REGION }}"
          INSTANCE_ID="${{ env.INSTANCE_ID }}"
          IMAGE_URI="${{ env.IMAGE_URI }}"
          ECR_REGISTRY="${{ env.ECR_REGISTRY }}"
          PORT="${{ env.PORT }}"

          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 759204735992.dkr.ecr.ap-south-1.amazonaws.com",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:$PORT --name app $IMAGE_URI"
            ]
          }
          SSMPARAMS

          sed -i "s|\$IMAGE_URI|$IMAGE_URI|g" /tmp/ssm-params.json
          sed -i "s|\$PORT|$PORT|g" /tmp/ssm-params.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$REGION" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          sleep 15

          STATUS=$(aws ssm list-command-invocations \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region "$REGION" \
            --query "CommandInvocations[0].Status" \
            --output text)

          echo "SSM Command Status: $STATUS"

          if [ "$STATUS" != "Success" ]; then
            echo "SSM command failed with status: $STATUS"
            exit 1
          fi

      - name: Health check
        run: |
          echo "Waiting for application to start..."
          sleep 10
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" ${{ env.PUBLIC_URL }} || echo "000")
          echo "HTTP Status Code: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Health check failed: expected 200, got $HTTP_CODE"
            exit 1
          fi
          echo "Health check passed! Application is running at ${{ env.PUBLIC_URL }}"